<header>
    <nav>
        <a href="{% url 'home' %}" id="nav-brand">
            💎 Expense<strong>Tracker</strong>
        </a>
        <div>
            <a href="{% url 'home' %}" id="nav-home">Home</a>
            {% if request.user.is_authenticated %}
                <span id="nav-user">👤 {{ request.user.username }}</span>
                <a href="{% url 'logout' %}" id="nav-logout">Log Out</a>
            {% else %}
                <a href="{% url 'login' %}" id="nav-login">Log In</a>
                <a href="{% url 'register' %}" id="nav-register">Sign Up</a>
            {% endif %}
        </div>
    </nav>
</header>
