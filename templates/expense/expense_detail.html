{% extends 'base.html' %}

{% block content %}

    {% if expense %}
    	<h1>{{ expense.name }}</h1>
        <span>Category: {{ expense.category }}</span>
        <span>Payment type: {{ expense.payment_type }}</span>
        <span>Amount: {{ expense.amount }}</span>
    {% else %}
        <h1>Wrong expense ID</h1>
    {% endif %}

{% endblock %}
