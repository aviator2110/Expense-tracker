{% extends 'base.html' %}

{% block content %}

    {% if expenses %}
    	{% for expense in expenses %}
    		<h1>{{ expense.name }}</h1>
            <span>Category: {{ expense.category }}</span>
            <span>Payment type: {{ expense.payment_type }}</span>
            <span>Amount: {{ expense.amount }} ₼</span>
        {% endfor %}
    {% else %}
        <h1>No expenses yet!</h1>
    {% endif %}

{% endblock %}
